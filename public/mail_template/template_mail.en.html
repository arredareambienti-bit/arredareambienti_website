<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="light only" />
<meta name="supported-color-schemes" content="light only" />

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

<title>New request - Arredare Ambienti</title>
</head>

<body style="
  margin:0;
  padding:24px;
  background:#000000;
  font-family:'Inter',Helvetica,Arial,sans-serif;
  color:#1A1712;
  -webkit-font-smoothing:antialiased;
">

  <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation">
    <tr>
      <td align="center">

        <!-- CARD -->
        <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation"
          style="
            max-width:600px;
            background:#E9E7CD;
            border-radius:16px;
            overflow:hidden;
            border:1px solid #D2A471;
            box-shadow:0 24px 64px rgba(22,17,11,0.24);
          "
        >

          <!-- HEADER -->
          <tr>
            <td style="
              padding:48px 32px 36px;
              background:#4e3211;
              background-image:linear-gradient(135deg,#86561D 0%,#4e3211 100%);
              text-align:center;
            ">

              <p style="
                margin:0 0 14px;
                font-family:'Inter',Helvetica,Arial,sans-serif;
                font-size:11px;
                font-weight:600;
                letter-spacing:2.4px;
                text-transform:uppercase;
                color:#D2A471;
              ">
                Arredare Ambienti
              </p>

              <h1 style="
                margin:0;
                font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;
                font-size:40px;
                line-height:1.15;
                font-weight:600;
                color:#E9E7CD;
                letter-spacing:0.5px;
              ">
                New request
              </h1>

              <table cellpadding="0" cellspacing="0" border="0" role="presentation" align="center" style="margin:20px auto 0;">
                <tr>
                  <td style="
                    width:56px;
                    height:2px;
                    background:#D2A471;
                    font-size:0;
                    line-height:0;
                  ">&nbsp;</td>
                </tr>
              </table>

              <p style="
                margin:20px 0 0;
                font-family:'Inter',Helvetica,Arial,sans-serif;
                font-size:14px;
                color:#D2A471;
                line-height:1.6;
              ">
                Received from the website contact form
              </p>

            </td>
          </tr>

          <!-- CONTENT -->
          <tr>
            <td style="padding:40px 32px;">

              <p style="
                margin:0 0 28px;
                font-family:'Inter',Helvetica,Arial,sans-serif;
                font-size:15px;
                line-height:1.7;
                color:#86561D;
              ">
                You received a new message. Contact details below.
              </p>

              <!-- INFO BOX -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation"
                style="
                  background:#FFFFFF;
                  border-radius:12px;
                  border:1px solid #D2A471;
                  overflow:hidden;
                "
              >

                <!-- NAME -->
                <tr>
                  <td style="
                    padding:20px 22px;
                    border-bottom:1px solid #F0EBE1;
                  ">
                    <p style="
                      margin:0 0 8px;
                      font-family:'Inter',Helvetica,Arial,sans-serif;
                      font-size:11px;
                      letter-spacing:2px;
                      text-transform:uppercase;
                      color:#AE7538;
                      font-weight:600;
                    ">
                      Name
                    </p>

                    <p style="
                      margin:0;
                      font-family:'Inter',Helvetica,Arial,sans-serif;
                      font-size:16px;
                      line-height:1.5;
                      color:#1A1712;
                    ">
                      {{name}}
                    </p>
                  </td>
                </tr>

                <!-- EMAIL -->
                <tr>
                  <td style="
                    padding:20px 22px;
                    border-bottom:1px solid #F0EBE1;
                  ">
                    <p style="
                      margin:0 0 8px;
                      font-family:'Inter',Helvetica,Arial,sans-serif;
                      font-size:11px;
                      letter-spacing:2px;
                      text-transform:uppercase;
                      color:#AE7538;
                      font-weight:600;
                    ">
                      Email
                    </p>

                    <p style="
                      margin:0;
                      font-family:'Inter',Helvetica,Arial,sans-serif;
                      font-size:16px;
                      line-height:1.5;
                      color:#1A1712;
                    ">
                      <a href="mailto:{{email}}" style="color:#86561D; text-decoration:none;">{{email}}</a>
                    </p>
                  </td>
                </tr>

                <!-- PHONE -->
                <tr>
                  <td style="
                    padding:20px 22px;
                    border-bottom:1px solid #F0EBE1;
                  ">
                    <p style="
                      margin:0 0 8px;
                      font-family:'Inter',Helvetica,Arial,sans-serif;
                      font-size:11px;
                      letter-spacing:2px;
                      text-transform:uppercase;
                      color:#AE7538;
                      font-weight:600;
                    ">
                      Phone
                    </p>

                    <p style="
                      margin:0;
                      font-family:'Inter',Helvetica,Arial,sans-serif;
                      font-size:16px;
                      line-height:1.5;
                      color:#1A1712;
                    ">
                      <a href="tel:{{phone}}" style="color:#86561D; text-decoration:none;">{{phone}}</a>
                    </p>
                  </td>
                </tr>

                <!-- MESSAGE -->
                <tr>
                  <td style="padding:22px;">

                    <p style="
                      margin:0 0 12px;
                      font-family:'Inter',Helvetica,Arial,sans-serif;
                      font-size:11px;
                      letter-spacing:2px;
                      text-transform:uppercase;
                      color:#AE7538;
                      font-weight:600;
                    ">
                      Message
                    </p>

                    <div style="
                      font-family:'Inter',Helvetica,Arial,sans-serif;
                      font-size:15px;
                      line-height:1.8;
                      color:#1A1712;
                      white-space:pre-line;
                    ">
                      {{message}}
                    </div>

                  </td>
                </tr>

              </table>

              <!-- FOOTER -->
              <p style="
                margin:36px 0 0;
                font-family:'Inter',Helvetica,Arial,sans-serif;
                font-size:12px;
                line-height:1.7;
                color:#86561D;
                text-align:center;
              ">
                This message was sent automatically from the <strong style="color:#4e3211;">Arredare Ambienti</strong> website.
              </p>

            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
